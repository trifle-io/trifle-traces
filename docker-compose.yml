name: "traces"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trifle
      POSTGRES_PASSWORD: trifle-secret
      POSTGRES_DB: trifle_traces_test
  mongo:
    image: mongo:latest
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: trifle
      MINIO_ROOT_PASSWORD: trifle-secret
  app:
    command: /bin/sh -c "while sleep 1000; do :; done"
    image: ruby:3.1
    depends_on:
      - postgres
      - mongo
      - minio
    environment:
      POSTGRES_URL: postgresql://trifle:trifle-secret@postgres:5432/trifle_traces_test
      MONGO_URL: mongodb://mongo:27017/trifle_traces_test
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: trifle
      S3_SECRET_ACCESS_KEY: trifle-secret
    volumes:
      - .:/workspaces/trifle-traces
    working_dir: /workspaces/trifle-traces
