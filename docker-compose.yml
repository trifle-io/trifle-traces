version: "3.7"
name: "traces"
services:
  mongo:
    image: mongo:latest
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: trifle
      MINIO_ROOT_PASSWORD: trifle-secret
  app:
    command: /bin/sh -c "while sleep 1000; do :; done"
    image: ruby:3.1
    depends_on:
      - mongo
      - minio
    environment:
      MONGO_URL: mongodb://mongo:27017/trifle_traces_test
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: trifle
      S3_SECRET_ACCESS_KEY: trifle-secret
    volumes:
      - .:/workspaces/trifle-traces
    working_dir: /workspaces/trifle-traces
